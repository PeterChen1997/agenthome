name: Bug report / 问题报告
description: Something is broken or behaves unexpectedly. / 功能出错或行为不符合预期。
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Do not paste real session content, API keys or tokens.** Security issues go to the private channel in SECURITY.md.
        感谢反馈。**不要粘贴真实会话内容、API key 或 token。** 安全问题请按 SECURITY.md 私密报告。
  - type: input
    id: version
    attributes:
      label: AgentHome version / 版本
      description: Shown in Settings, or the release you downloaded. / 设置页可见，或你下载的发布版本。
      placeholder: "0.1.4"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: macOS version and chip / macOS 版本与芯片
      placeholder: "macOS 15.5, Apple M3"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area / 涉及部分
      multiple: true
      options:
        - Archive / 归档
        - Search / 搜索
        - Dashboard / 仪表盘
        - Quota / 额度
        - Habitat / 栖息地
        - Sync & ingest / 同步与入库
        - Settings / 设置
        - CLI
        - Other / 其他
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Session source / 会话来源
      multiple: true
      options:
        - Claude Code
        - Codex
        - Gemini CLI
        - Not source-specific / 与来源无关
  - type: textarea
    id: what-happened
    attributes:
      label: What happened / 发生了什么
      description: Include what you expected instead. / 同时写明你预期的结果。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / 复现步骤
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots / 日志或截图
      description: Redact session titles, project names and paths you do not want to share. / 请先遮盖不想公开的会话标题、项目名与路径。
      render: text
