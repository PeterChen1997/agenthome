  en: "Cache read"
  zh-CN: "缓存读"
dashboard.cache_write:
  en: "Cache write"
  zh-CN: "缓存写"
dashboard.cache_read_note:
  en: "Re-read every turn · ~1/10 price"
  zh-CN: "每轮重读上下文 · 约 1/10 价"
dashboard.cache_explain:
  en: "Why cache reads are so large: in a long session every request re-reads the whole conversation from cache and counts it as tokens, so the same context is counted again and again (%{hit_rate}). Cache reads are billed at about 1/10 of the input price, so token counts look huge while cost grows far more slowly. For actual spend, see “%{cost}” below."
  zh-CN: "缓存读为什么这么大：长会话里每一轮请求都会把整段对话上下文从缓存重读一遍并计入 token，同一段上下文被反复计数（%{hit_rate}）。它按约 1/10 的输入单价计费，所以 token 数看着惊人、花费并不按比例增长——实际花费以下方「%{cost}」为准。"
