_version: 2
update.title:
  en: Software update
  zh-CN: 软件更新
update.hint:
  en: Checks GitHub for a newer release; only the version number is fetched, nothing about your sessions is sent
  zh-CN: 到 GitHub 查有没有新版本；只读取版本号，不发送任何会话数据
update.current:
  en: Current version
  zh-CN: 当前版本
update.checking:
  en: Checking for updates…
  zh-CN: 正在检查更新…
update.failed:
  en: "Couldn't check for updates: %{error}"
  zh-CN: "检查更新失败：%{error}"
update.available:
  en: "Version %{version} is available"
  zh-CN: "有新版本 %{version} 可以下载"
update.up_to_date:
  en: "You're on the latest version · checked %{time}"
  zh-CN: "已是最新版本 · %{time}检查"
update.never_checked:
  en: Not checked yet
  zh-CN: 还没有检查过
update.check_now:
  en: Check now
  zh-CN: 检查更新
update.download:
  en: Download
  zh-CN: 前往下载
update.later:
  en: Later
  zh-CN: 稍后
update.auto:
  en: Check automatically (at launch and once a day)
  zh-CN: 自动检查（启动时与每天一次）
update.prompt_title:
  en: "AgentHome %{version} is available"
  zh-CN: "AgentHome %{version} 已发布"
update.prompt_body:
  en: "You're on %{current}. Download the new version from the release page, unzip it and drag it into Applications to replace the old one; your archive and index stay as they are."
  zh-CN: "当前是 %{current}。到发布页下载新版本，解压后拖进「应用程序」覆盖旧版即可，归档和索引库不受影响。"
update.badge:
  en: "Update to %{version}"
  zh-CN: "更新到 %{version}"
update.badge_downloading:
  en: Downloading update…
  zh-CN: 正在下载更新…
update.badge_installing:
  en: Restarting…
  zh-CN: 即将重启…
update.install_now:
  en: Update now
  zh-CN: 立即更新
update.release_notes:
  en: Release notes
  zh-CN: 发布说明
update.downloading:
  en: "Downloading and verifying the new version (checksum, signature, notarization)… AgentHome restarts by itself when it's done"
  zh-CN: "正在下载并验证新版本（校验和、签名、公证）…完成后应用会自动重启"
update.installing:
  en: Verified. AgentHome is closing to install the new version and will reopen by itself
  zh-CN: 验证通过，应用即将退出安装新版本，随后自动重新打开
update.install_failed:
  en: "Update failed, nothing was changed: %{error}"
  zh-CN: "更新失败，没有改动任何东西：%{error}"
update.prompt_body_in_app:
  en: "You're on %{current}. Update now downloads the new version, checks its signature and notarization, replaces the app and restarts it. Your archive and index stay as they are."
  zh-CN: "当前是 %{current}。点「立即更新」会下载新版本，验证签名与公证后替换应用并自动重启，归档和索引库不受影响。"
