  zh-CN: 把这段逻辑抽成独立模块，注意不要改公开接口。
mock.user.2:
  en: "There are three compiler warnings right now. Fix all of them, no #[allow]."
  zh-CN: 现在编译有三个 warning，全部清掉，不要加 allow。
mock.user.3:
  en: Explain what this trait is for, then give me a minimal example.
  zh-CN: 解释一下这个 trait 的作用，然后给出一个最小示例。
mock.user.4:
  en: The list jitters when it scrolls to the bottom. Can you figure out why?
  zh-CN: 列表滚动到底部时会抖一下，帮我定位原因。
mock.assistant.0:
  en: |-
    ## Root cause

    `items.first()` is followed by a bare `unwrap()`, so an empty list always panics.

    Suggested fix:

    1. Return early with `let Some(first) = items.first() else { return Ok(()) };`
    2. Add a regression test for empty input.

    ```rust
    fn head(items: &[u32]) -> Option<u32> {
        items.first().copied()
    }
    ```

    `cargo test` passes after the change.
  zh-CN: |-
    ## 结论

    问题出在 `items.first()` 之后直接 `unwrap()`，空列表时必然 panic。

    修改建议：

    1. 用 `let Some(first) = items.first() else { return Ok(()) };` 提前返回；
    2. 给空输入补一个回归测试。

    ```rust
    fn head(items: &[u32]) -> Option<u32> {
        items.first().copied()
    }
    ```

    改完后 `cargo test` 全绿。
mock.assistant.1:
  en: |-
    This trait decouples **data access** from the **UI**: views only depend on `DataSource` and don't care whether it's backed by SQLite or memory.

    - Queries run on a background thread;
    - results are written back to entities on the foreground;
    - the UI thread never does IO.

    > Note: implementations must be `Send + Sync`, otherwise they can't be called across threads.
  zh-CN: |-
    这个 trait 把**数据访问**和**界面**解耦：界面只依赖 `DataSource`，不关心背后是 SQLite 还是内存。

    - 查询在后台线程跑；
    - 结果回到前台再写入实体；
    - UI 线程不做 IO。

    > 注意：实现必须是 `Send + Sync`，否则不能跨线程调用。
