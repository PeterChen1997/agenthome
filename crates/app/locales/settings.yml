settings.claude_usage_title:
  en: Claude Code · official /usage (background)
  zh-CN: Claude Code · 官方 /usage（后台）
settings.claude_usage_desc:
  en: "Claude quota comes from the official /usage, read in the background every 15 minutes by running the official claude command once (about 10 seconds). It sends no conversation, uses no tokens and reads no credentials, so desktop-app users see their subscription quota too. No statusline needed."
  zh-CN: "Claude 额度来自官方 /usage，每 15 分钟后台读取：启动一次官方 claude 命令（约 10 秒），不发对话、不耗 token、不读凭据，桌面版用户也能看到订阅额度。不需要再装 statusline。"
