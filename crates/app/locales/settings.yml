settings.about_title:
  en: Compliance & pricing
  zh-CN: 合规与定价
settings.about_quota:
  en: "· Quota comes only from official tools and local files: Claude from the official claude command's /usage, Codex from session rollouts. AgentHome reads no credentials and does not use high-risk sources that need account credentials, such as the Claude OAuth usage endpoint or the Codex wham endpoint."
  zh-CN: "· 额度只走官方程序与本机文件：Claude 由官方 claude 命令的 /usage 提供，Codex 走会话 rollout。AgentHome 不读取凭据，不提供 Claude OAuth usage 端点、Codex wham 端点等需要账号凭据的高风险来源。"
settings.about_credentials:
  en: "· No login credentials are read or stored. Only session files are read: originals are copied into ~/AgentHome/raw and parsed into the index; agent folders are never modified."
  zh-CN: "· 不读取、不保存任何登录凭据；只读取会话文件：原件拷贝进 ~/AgentHome/raw、解析进索引，不改动 agent 原目录。"
