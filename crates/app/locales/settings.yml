settings.reset_title:
  en: ChatGPT reset credits
  zh-CN: ChatGPT 重置额度
settings.reset_desc:
  en: "Not stored on this Mac. Query starts the official codex (bundled with the ChatGPT app) to read them once with your signed-in account. Read-only: nothing is redeemed and AgentHome never reads your credentials. Updates only when you click."
  zh-CN: "本机文件里没有这项数据。点「查询」后，AgentHome 启动官方 codex（ChatGPT 桌面版自带）用你已登录的账号只读查一次：不兑换，AgentHome 也不读你的登录凭据。只在你点的时候更新。"
