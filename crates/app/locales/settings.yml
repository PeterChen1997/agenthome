settings.agy_usage_title:
  en: Antigravity CLI · official /usage (background)
  zh-CN: Antigravity CLI · 官方 /usage（后台）
settings.agy_usage_desc:
  en: "Antigravity quota (5-hour and weekly limits for the Gemini group and the Claude/GPT group, plus the separate weekly Gemini 4 Argon limit on Pro plans) comes from the official agy /usage, read every 15 minutes by running agy -p /usage once (about 12 seconds). It starts no conversation, uses no tokens and reads no credentials."
  zh-CN: "Antigravity 额度（Gemini 组与 Claude/GPT 组各自的 5 小时与每周额度，以及 Pro 套餐单独的 Gemini 4 Argon 周额度）来自官方 agy 的 /usage，每 15 分钟后台运行一次 agy -p /usage（约 12 秒）：不建对话、不耗 token、不读凭据。"
