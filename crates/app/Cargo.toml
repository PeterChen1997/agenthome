[package]
name = "agenthome-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "agenthome-app"
path = "src/main.rs"

[dependencies]
agenthome-core.workspace = true
anyhow.workspace = true
chrono.workspace = true
dirs.workspace = true
gpui-kit.workspace = true
rust-i18n = "4"
serde_json.workspace = true
sys-locale = "0.3"

# 离屏截图（文档与端到端核对用，锁屏时也能出图）：`cargo build -p agenthome-app --features capture`
# 打开 gpui 的 test-support，换来 `Window::render_to_image`；正式包不开。
[target.'cfg(target_os = "macos")'.dependencies]
gpui-pre-macos = { version = "=0.3.11", optional = true, features = ["test-support"] }
image = { version = "0.25", optional = true, default-features = false, features = ["png"] }

[features]
capture = ["dep:gpui-pre-macos", "dep:image"]
