[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/app"]

[workspace.package]
version = "0.1.3"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
agenthome-core = { path = "crates/core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
walkdir = "2"
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
hostname = "0.4"
unicode-width = "0.2"
zstd = "0.14"
tempfile = "3"
notify = "8.2"
portable-pty = "0.9"
vt100 = "0.18"
# 精确锁定：gpui-kit 每周一版，minor 常带 breaking。0.9.0 对应 gpui-pre =0.3.11。
gpui-kit = "=0.9.0"

# GPUI 全源码编译，debug 不开优化会慢到不可用。
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
